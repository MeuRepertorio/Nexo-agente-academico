  <style>
    /* =========================================================
       ESTILOS BASE & ATMOSFERA ESPACIAL MINIMALISTA
       ========================================================= */
    :root {
      --bg: #050507;
      --fg: #f5f5f7;
      --muted: #8a8a93;
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.28);
      --glass: rgba(18, 18, 22, 0.75);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Canvas de partículas espaciais */
    #space-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Brilho radial sutil no fundo */
    .ambient-glow {
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 55vh;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.045) 0%, rgba(5, 5, 7, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    /* Superfície Glassmorphism Fosco */
    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.3s ease,
                  box-shadow 0.35s ease,
                  background-color 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(24, 24, 30, 0.82);
    }

    /* Card de matéria em foco no carrossel */
    .subject-card-active {
      border-color: rgba(255, 255, 255, 0.38) !important;
      box-shadow: 0 0 35px -8px rgba(255, 255, 255, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transform: translateY(-6px) scale(1.02);
      background: rgba(26, 26, 32, 0.88) !important;
    }

    /* Flutuação sutil para os cards do Hub */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .float-anim {
      animation: floatSlow 6s ease-in-out infinite;
    }

    /* Transição suave entre telas */
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .screen-enter {
      animation: screenIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Linha divisória luminosa fina */
    .horizon-line {
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.22) 25%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0.22) 75%, rgba(255,255,255,0) 100%);
    }

    /* Scrollbar ultra-discreta */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .thin-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
    }
    .thin-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Cursor piscando durante efeito de digitação do NEXO */
    @keyframes blinkCaret {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typing-caret::after {
      content: '▍';
      margin-left: 2px;
      color: #f5f5f7;
      animation: blinkCaret 0.8s infinite;
    }

    /* Pulso discreto no nó ativo da linha temporal */
    .node-glow {
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.55);
    }

.reference-stars{position:absolute;inset:0;z-index:3}
.reference-stars i{position:absolute;display:block;width:4px;height:4px;border-radius:50%;background:#cacbd4;box-shadow:0 0 8px 2px rgba(225,227,235,.18);opacity:.55;animation:ref-star 6s ease-in-out infinite alternate}
.reference-stars i:nth-child(1){left:10%;top:22%;width:9px;height:9px;opacity:.95;box-shadow:0 0 14px 4px rgba(217,218,224,.3)}
.reference-stars i:nth-child(2){left:3.1%;top:50%;width:4px;height:4px;opacity:.65;animation-delay:2s}
.reference-stars i:nth-child(3){left:25.6%;top:84.6%;width:8px;height:8px;opacity:.22;filter:blur(3px);animation-delay:1.6s}
.reference-stars i:nth-child(4){left:50.9%;top:14.3%;width:3px;height:3px;opacity:.3;animation-delay:2.8s}
.reference-stars i:nth-child(5){left:17.2%;top:25.2%;width:2px;height:2px;opacity:.36;animation-delay:1.1s}
.reference-stars i:nth-child(6){left:91%;top:34%;width:2px;height:2px;opacity:.3;animation-delay:3.4s}
.reference-stars i:nth-child(7){left:4%;top:48%;width:2px;height:2px;opacity:.4;animation-delay:4s}
.reference-stars i:nth-child(8){left:96%;top:39%;width:2px;height:2px;opacity:.25}
.reference-stars i:nth-child(9){left:28%;top:4%;width:2px;height:2px;opacity:.17}
@keyframes ref-star{to{opacity:.18;transform:scale(.65)}}
body>.relative.z-10{position:relative;z-index:4;min-height:100dvh}
.ref-header{height:102px;width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:31px clamp(22px,3%,47px) 0;z-index:32;position:relative;background:transparent;border:0}
.ref-brand{display:inline-flex;align-items:center;gap:11px;background:transparent;border:0;padding:0;color:#f2f2f3;cursor:pointer;white-space:nowrap;min-height:40px}
.ref-brand-mark{width:34px;height:36px;opacity:.93;flex-shrink:0}
.ref-brand-word{font-size:36px;line-height:1;font-weight:400;letter-spacing:-1.1px}
.ref-live-dot{display:inline-block;margin-left:7px;width:9px;height:9px;border-radius:50%;background:#f2f2f4;box-shadow:0 0 16px 4px rgba(255,255,255,.4)}
.ref-header-right{display:flex;align-items:center;gap:10px}
.ref-search-trigger{height:38px;width:360px;max-width:36vw;border:1px solid rgba(227,229,237,.11);background:linear-gradient(125deg,rgba(50,50,55,.72),rgba(35,35,39,.73));border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 11px;color:rgba(231,231,235,.43);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);cursor:pointer;transition:border-color .2s,background .2s}
.ref-search-trigger:hover{border-color:rgba(250,250,255,.35);background:rgba(50,50,54,.88)}
.ref-search-trigger svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.35;fill:none;flex-shrink:0}
.ref-search-trigger>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left;font-size:14px;font-weight:400;letter-spacing:.015em}
.ref-search-trigger kbd{border-left:1px solid rgba(233,233,236,.13);padding-left:13px;font-family:inherit;font-size:14px;opacity:.6;white-space:nowrap}
.ref-nav-arrow{height:38px;width:38px;background:linear-gradient(145deg,rgba(44,44,49,.66),rgba(27,27,30,.7));border:1px solid rgba(224,224,231,.08);border-radius:7px;display:grid;place-items:center;color:rgba(230,230,235,.43);cursor:pointer;transition:.25s var(--ease)}
.ref-nav-arrow:hover{background:#29292e;color:white;border-color:rgba(255,255,255,.3)}
.ref-nav-arrow:active{transform:scale(.96)}
.ref-nav-arrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.ref-sr-progress{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
#app-main{position:relative;z-index:3}
body[data-view="hub"] footer{display:none}
footer{border-color:rgba(255,255,255,.08)!important;color:#65656c!important;background:transparent!important}
.reference-home{position:relative;display:flex;flex:1;flex-direction:column;justify-content:center;min-height:calc(100dvh - 102px);overflow:hidden;padding:30px 0 74px;animation:ref-screen .46s ease-out both}
@keyframes ref-screen{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.ref-stage{position:relative;width:min(1234px,calc(100vw - 76px));margin:auto;transform:translateY(-4px)}
.ref-stage:before{content:'';position:absolute;width:82%;height:130px;left:9%;top:35%;z-index:0;background:radial-gradient(ellipse,rgba(206,208,224,.075),transparent 68%);filter:blur(35px);pointer-events:none}
.ref-cards{display:flex;align-items:stretch;gap:25px;width:100%;overflow-x:auto;overscroll-behavior-x:contain;scroll-behavior:smooth;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 0 0;position:relative;z-index:2;cursor:grab;touch-action:pan-x pan-y}
.ref-cards:active{cursor:grabbing}
.ref-cards::-webkit-scrollbar{display:none}
.ref-card{position:relative;display:block;flex:0 0 calc((100% - 100px)/5);min-width:0;height:260px;padding:0;text-align:left;border-radius:12px;border:1px solid rgba(224,225,232,.25);background:linear-gradient(140deg,rgba(56,56,61,.54),rgba(30,30,34,.48) 50%,rgba(25,25,29,.58));color:#f0f0f2;overflow:hidden;box-shadow:inset 0 1px 1px rgba(255,255,255,.075),0 12px 25px rgba(0,0,0,.18);scroll-snap-align:center;backdrop-filter:blur(12px) saturate(.65);-webkit-backdrop-filter:blur(12px) saturate(.65);transition:border-color .3s,box-shadow .35s,background .35s,transform .35s var(--ease);cursor:pointer;user-select:none}
.ref-card:hover{border-color:rgba(241,241,247,.55);background:linear-gradient(145deg,rgba(64,64,70,.66),rgba(31,31,35,.7));transform:translateY(-3px)}
.ref-card.subject-card-active{border-color:rgba(248,248,255,.78);background:linear-gradient(135deg,rgba(78,78,84,.62),rgba(34,34,39,.68) 54%,rgba(49,49,53,.57));box-shadow:0 0 0 1px rgba(244,245,252,.07),0 0 35px 5px rgba(230,233,255,.16),inset 0 0 22px rgba(229,231,241,.085),0 20px 42px rgba(0,0,0,.28);transform:translateY(-1px)}
.ref-card .ref-corners{position:absolute;inset:8px;z-index:10;pointer-events:none}
.ref-corners i{position:absolute;width:12px;height:12px;opacity:.6;border-color:#e2e2e6;border-style:solid;transition:opacity .3s}
.ref-corners i:nth-child(1){left:0;top:0;border-width:1px 0 0 1px;border-radius:4px 0 0 0}
.ref-corners i:nth-child(2){right:0;top:0;border-width:1px 1px 0 0;border-radius:0 4px 0 0}
.ref-corners i:nth-child(3){left:0;bottom:0;border-width:0 0 1px 1px;border-radius:0 0 0 4px}
.ref-corners i:nth-child(4){right:0;bottom:0;border-width:0 1px 1px 0;border-radius:0 0 4px 0}
.ref-card.subject-card-active .ref-corners i{opacity:.95}
.ref-card-small-icon{position:absolute;top:23px;left:22px;width:36px;height:36px;display:flex;justify-content:center;align-items:center;color:rgba(202,202,209,.48);z-index:3}
.ref-card-small-icon svg{height:33px;width:33px;stroke-width:2.8}
.ref-card-small-icon .math-symbol{font-family:Georgia,serif;font-style:italic;font-size:32px;font-weight:400;line-height:1}
.ref-card-big-icon{position:absolute;width:128px;height:128px;display:flex;align-items:center;justify-content:center;top:66px;left:50%;transform:translateX(-50%);z-index:1;color:rgba(222,224,234,.44);opacity:.76;filter:blur(6px);pointer-events:none}
.ref-card-big-icon svg{width:112px;height:112px;stroke-width:3.2}
.ref-card-big-icon .math-symbol{font-family:Georgia,serif;font-size:95px;line-height:1;font-style:italic;white-space:nowrap;letter-spacing:-8px;font-weight:500}
.ref-card.subject-card-active .ref-card-big-icon{opacity:.91;color:rgba(236,238,244,.45);filter:blur(6px)}
.ref-card-content{position:absolute;z-index:4;bottom:23px;left:24px;right:14px;display:block}
.ref-card-content strong{display:block;font-size:28px;line-height:1.2;font-weight:350;letter-spacing:-.65px;color:#f1f1f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-card-content small{display:block;margin-top:3px;font-size:14px;font-weight:350;color:rgba(217,217,221,.37);white-space:nowrap}
.ref-track{height:2px;position:relative;margin-top:28px;background:rgba(220,220,227,.11);width:100%;overflow:visible}
.ref-track-fill{height:2px;width:80%;position:relative;background:linear-gradient(90deg,rgba(255,255,255,.7),#fff 66%,rgba(247,247,249,.9));box-shadow:0 0 8px rgba(255,255,255,.6),0 0 22px rgba(255,255,255,.12);transition:width .45s var(--ease)}
.ref-wave{position:absolute;color:rgba(231,233,241,.64);right:max(calc((100vw - 1234px)/2 + 5px),6%);top:calc(50% - 200px);width:45px;height:36px;opacity:.8}
.ref-wave svg{width:100%;height:100%}
.ref-dots{position:absolute;bottom:55px;display:grid;grid-template-columns:repeat(3,5px);gap:6px;opacity:.24}
.ref-dots i{width:4px;height:4px;border-radius:50%;background:#d8d9e1}
.ref-dots-left{left:3%}.ref-dots-right{right:3%}
.ref-screen-reader-hint{position:absolute;width:1px;height:1px;clip-path:inset(50%);white-space:nowrap;overflow:hidden}
/* Shared visual language on detail screens, without modifying content. */

<body class="antialiased selection:bg-white/20 selection:text-white">

  ></div>

  <script>
    /* Fundo geométrico renderizado por SVG estático: sem canvas permanente. */

    /* =====================================================================
       2. ÍCONES SVG MINIMALISTAS POR MATÉRIA
       ===================================================================== */
    const SUBJECT_ICONS = {
      historia: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 6v6l4 2" stroke-linecap="round"/><circle cx="12" cy="12" r="9"/></svg>`,
      geografia: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a14.5 14.5 0 0 0 0 18M12 3a14.5 14.5 0 0 1 0 18"/></svg>`,
      ingles: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14" stroke-linecap="round"/><circle cx="18" cy="12" r="2.5"/></svg>`,
      fisica: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(30 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-30 12 12)"/></svg>`,
      biologia: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M7 4c0 6 10 6 10 16M17 4c0 6-10 6-10 16M8 8h8M8 16h8" stroke-linecap="round"/></svg>`,
      quimica: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 3h6M10 3v5.5L5.2 17.6A2 2 0 0 0 7 20.5h10a2 2 0 0 0 1.8-2.9L14 8.5V3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 15h8"/></svg>`,
      portugues: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke-linecap="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
      matematica: `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 18c2.5-10 6.5-14 8-14s5.5 4 8 14" stroke-linecap="round"/><path d="M3 12h18" stroke-dasharray="2 3"/></svg>`,
    };


    const REFERENCE_ICONS = {
      historia: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 16h40v48H20c-5 0-8-3-8-8V26c0-6 3-10 8-10Z"/><path d="M21 16c-5 0-9 4-9 9v31c0-5 3-8 9-8h39M30 28h20M30 37h15"/></svg>',
      fisica: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="40" cy="40" r="5" fill="currentColor" stroke="none"/><ellipse cx="40" cy="40" rx="32" ry="12" transform="rotate(35 40 40)"/><ellipse cx="40" cy="40" rx="32" ry="12" transform="rotate(-35 40 40)"/><ellipse cx="40" cy="40" rx="32" ry="12" transform="rotate(90 40 40)"/></svg>',
      matematica: '<span class="math-symbol">ƒx</span>',
      quimica: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M31 7h18M35 7v25L15 64a6 6 0 0 0 5 9h40a6 6 0 0 0 5-9L45 32V7M23 54h34"/></svg>',
      biologia: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2"><path d="M24 9C55 20 54 34 24 49S26 70 55 73M56 9C26 20 26 34 56 49S53 70 25 73M28 17h24M35 27h10M30 38h20M28 50h24M35 60h10"/></svg>',
      geografia: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="40" cy="40" r="30"/><path d="M10 40h60M16 25h48M16 55h48M40 10c-22 15-22 45 0 60M40 10c22 15 22 45 0 60"/></svg>',
      portugues: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 9h41v61H22c-9 0-10-5-10-10V20c0-7 3-11 10-11Zm0 49h41M26 25h28M26 36h23"/></svg>',
      ingles: '<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 18h54M13 40h40M13 62h54"/><circle cx="60" cy="40" r="7"/></svg>'
    };
    /* =====================================================================
       3. BASE DE DADOS COMPLETA — 8 MATÉRIAS · 114 AULAS · RESPOSTAS RESUMIDAS
       ===================================================================== */
    // Helper compacto para montar cada aula mantendo o código limpo, rápido e completo
    function makeLesson(num, title, summary, praticaList, cadernoText, meta = {}) {
      const activities = [];
      praticaList.forEach((item, idx) => {
        activities.push({
          id: `p${idx + 1}`,
          type: 'Na prática',
          title: item.t || `Atividade ${idx + 1}`,
          prompt: item.p,
          answer: item.a,
          concept: item.c || meta.c || `Conceito-chave de ${title}: ${summary}`,
          steps: item.s || meta.s || `1. Releia o comando central da atividade.\n2. Relacione o enunciado ao conceito principal da aula (${title}).\n3. Sintetize a resposta objetiva destacada ao lado.`,
          tip: item.d || meta.d || `Foque nos termos centrais de "${title}" — são os pontos mais cobrados em provas e vestibulares.`,
        });
      });
      if (cadernoText) {
        activities.push({
          id: 'caderno',
          type: 'Caderno de Exercícios',
          title: 'Questões do Caderno de Exercícios',
          prompt: `Gabarito resumido das questões externas referentes à Aula ${String(num).padStart(2, '0')} (${title}).`,
          answer: cadernoText,
          concept: meta.c || `Revisão aplicada de ${title}: ${summary}`,
          steps: `1. Identifique a palavra-chave de cada enunciado de vestibular/ENEM.\n2. Elimine distratores que contradizem a base teórica da aula.\n3. Confira o gabarito direto listado no card de resposta.`,
          tip: meta.d || `Em questões de vestibular sobre ${title}, atenção especial a comandos como "EXCETO", "respectivamente" e relações de causa/consequência.`,
        });
      }
      return { num, title, summary, activities };
    }

    const SUBJECTS = [
      /* -------------------------------------------------------------------
         1. HISTÓRIA (Apostila 1 — 12 Aulas)
         ------------------------------------------------------------------- */
      {
        id: 'historia',
        name: 'História',
        book: 1,
        bookLabel: 'Apostila 1 · Humanas & Inglês',
        subtitle: 'Brasil Colônia, Escravidão, Liberalismo e Revolução Industrial',
        lessons: [
          makeLesson(1, 'Os mapas contam histórias', 'Cartografia colonial como instrumento político de poder, fronteiras e o Tratado de Madri (1750).', [

          ], '• Q1 (UNIMONTES): d) incorreta — não visava conciliação religiosa, mas catequização/aculturação.\n• Q2 (UFT): a) diálogo em que São Lourenço intercede pelos índios.'),

          makeLesson(2, 'José de Anchieta — Parte 2', 'Efeitos de sentido do pretérito perfeito (ação pontual) e imperfeito (hábito duradouro).', [
            { t: 'Atividades 1 e 2 — Tempos verbais no Auto', p: 'Identificação dos pretéritos na estrofe de Aimbirê e associação.', a: '• Ativ. 1: Imperfeito = "morava", "afastava" (estado antigo/habitual); Perfeito = "entregaram" (momento decisivo da conversão).\n• Ativ. 2 (Associação): (2) afastava · (1) tranquilizei-me · (1) bebemos · (2) dançavam.' }
          ], '• Q1 (CECIERJ): a) ação desenvolvida / concluída / anterior a outra passada.\n• Q2 (UFRN): d) imperfeito e presente constroem imagens contrastantes do trapiche.'),

          makeLesson(3, 'Barroco: Gregório de Matos — Parte 1', 'Estética da tensão, chiaroscuro, sátira social, poesia sacra e conceptismo.', [
            { t: 'Atividades 1 e 2 — Sátira e Soneto Sagrado', p: 'Características barrocas nos versos e estratégia lógica do soneto.', a: '• Ativ. 1: alternativas (b) apelo emocional e (c) foco no sofrimento/drama.\n• Ativ. 2: Estratégia conceptista — quanto maior o pecado do homem, maior a oportunidade de Deus exercer sua clemência e glória ao perdoar.' }
          ], '• Q1 (UNESP): a) representa satiricamente governantes e desonestidade na Bahia.\n• Q2 (UFJF): e) consciência da fugacidade do tempo.'),

          makeLesson(4, 'Barroco: Gregório de Matos — Parte 2', 'Concordância nominal: regra geral, múltiplos substantivos e casos especiais (bastante, meio, anexo).', [
            { t: 'Atividades 1 e 2 — Concordância nominal na prática', p: 'Uso de "bastantes" em Gregório de Matos e preenchimento de lacunas.', a: '• Ativ. 1: a) "bastantes" concorda com "os" (governantes); b) enfatiza que há governantes em excesso apenas para causar dano.\n• Ativ. 2 (Lacunas): mortos · própria · inclusas · meio (advérbio invariável).' }
          ], '• Q1 (IF Sul): a) Uma palavra (apenas o verbo "paguei" → "pagamos").\n• Q2 (UNICEUB): a) argumento – anexas – meio – simpáticas.'),

          makeLesson(5, 'Barroco: Padre Antônio Vieira — Parte 1', 'Conceptismo argumentativo e crítica social no "Sermão de Santo Antônio aos Peixes".', [
            { t: 'Atividades 1 e 2 — Metáfora dos peixes e do pão quotidiano', p: 'Crítica social, gradação verbal e uso da linguagem religiosa.', a: '• Ativ. 1: a) denuncia exploração dos mais fracos pelos poderosos; b) "grandes" = elite/governantes, "pequenos" = pobres/escravizados.\n• Ativ. 2: a) "pão quotidiano" = exploração diária e contínua; b) gradação "comam, traguem, devorem" intensifica a voracidade; c) linguagem religiosa condena moralmente a injustiça social.' }
          ], '• Q1 (UNESP): c) antíteses reconhecendo a escravização como caminho possível da missão.\n• Q2 (CESMAC): a) 1, 2, 3 e 4 corretas.'),

          makeLesson(6, 'Barroco: Padre Antônio Vieira — Parte 2', 'Engenharia discursiva conceptista e regras de concordância verbal.', [
            { t: 'Atividades 1 e 2 — Concordância verbal', p: 'Sujeito composto posposto e identificação de concordância adequada.', a: '• Ativ. 1: "Nascerão na alma o fruto e a esperança" (lógica/plural) ou "Nascerá na alma o fruto e a esperança" (atrativa/núcleo mais próximo).\n• Ativ. 2: b) "Ler, escrever e pregar era a rotina de Vieira" (sujeito formado por infinitivos admite singular).' }
          ], '• Q1 (CEDERJ): b) "observaram" concorda com "pesquisadores do grupo Mave".\n• Q2 (FASEH): c) concordância facultativa (singular ou plural com "a maior parte delas").'),

          makeLesson(7, 'Expressões do Barroco em Portugal', 'Chiaroscuro, hipérboles, antíteses, efemeridade, carpe diem e memento mori.', [
            { t: 'Atividades 1 e 2 — Mariana Alcoforado e Gregório de Matos', p: 'Exageros/contrastes barrocos e conselho ligado à efemeridade.', a: '• Ativ. 1: Hipérbole ("amo mil vezes mais que à minha vida") e antítese ("prazer" vs. "sofrimento").\n• Ativ. 2: Conselho de carpe diem ("goza da flor da mocidade") justificado pela rapidez do tempo que converte tudo em "terra, cinza, pó, nada".' }
          ], '• Q1 (ENEM 2022): a) resposta às contestações aos domínios do papado (Contrarreforma).\n• Q2 (UNICENTRO): d) transitoriedade / enumeração de ideias.'),

          makeLesson(8, 'Barroco e contemporaneidade', 'Ecos barrocos na poesia moderna (Lêdo Ivo, Leminski) e figuras de linguagem.', [
            { t: 'Atividades 1 e 2 — Poema de Lêdo Ivo e criação barroca', p: 'Comparação, choque sensorial e sátira social no poema.', a: '• Ativ. 1: 1) "Alteiam os pescoços como gansos" animaliza os pobres; 2) cores vibrantes e odores criam choque barroco entre elite e subúrbio; 3) é sátira usando a voz do preconceituoso para expor o ridículo.\n• Ativ. 2: Produção pessoal com 1 verso de hipérbole e 1 verso de hipérbato.' }
          ], '• Q3 (CESMAC — Machado): a) Barroco (antíteses e dualismo vida/morte).\n• Q4 (UPE — Moda): c) 2 e 3 apenas (excesso de detalhes e mistura de informações).'),

          makeLesson(9, 'Editorial — Parte 1', 'Gênero opinativo institucional sem assinatura, tese e argumentos de prova concreta.', [
            { t: 'Atividades 1 e 2 — Editorial sobre obesidade (O Tempo)', p: 'Tese, função dos dados Vigitel, responsabilidade e verba de R$ 340 milhões.', a: '• Ativ. 1: a) Tese: obesidade é crise urgente de saúde pública, não estética; b) Vigitel = prova concreta/autoridade; c) responsabilidade compartilhada ("política regular de Estado" e "cuidado diário de cada brasileiro").\n• Ativ. 2: b) validar a gravidade e magnitude do cenário epidemiológico.' }
          ], '• Q1 (ENEM 2014): d) interpretar criticamente fatos relevantes para a opinião pública.\n• Q2 (VUNESP 2018): d) discutir perigos do álcool/drogas com base em estudo da USP.'),

          makeLesson(10, 'Editorial — Parte 2 (Coesão textual)', 'Coesão referencial (anáfora, catáfora, elipse) e sequencial (conectores lógicos).', [
            { t: 'Atividades 1 e 2 — Editorial sobre Fake News', p: 'Pronome "lhes", conjunção adversativa, imperativos e "assim como".', a: '• Ativ. 1: a) "lhes" retoma "deseducados" e "educados"; b) "mas" contrapõe falta de leitura à conveniência política; c) imperativos ("pesquise", "informe-se") convocam ação prática do leitor.\n• Ativ. 2: a) equivalência entre processos paralelos no tempo ("assim como").' }
          ], '• Q1 (FUVEST 2021): c) efeito cascata, mercado editorial, crise, queda de vendas.\n• Q2 (ENEM 2021): e) "[...] não ficar brigando com ele" (retoma "nome").'),

          makeLesson(11, 'Editorial — Parte 3 (Modalizadores)', 'Assunto × tema, verbos opinativos e modalizadores de certeza, dúvida, compromisso e refutação.', [
            { t: 'Atividades 1 e 2 — Editorial sobre violência urbana', p: 'Comparação entre "precisa" e "talvez" e produção de parágrafo.', a: '• Ativ. 1: "precisa" indica necessidade e cobrança política firme junto ao Estado; "talvez" introduz dúvida/suposição e enfraquece a força argumentativa do editorial.\n• Ativ. 2: Produção pessoal sobre câmeras na escola usando modalizador de certeza ("sem dúvida") e de refutação ("apesar de").' }
          ], '• Q3 (ENEM 2017): a) relato pessoal que especifica o debate.\n• Q4 (UNESP 2019): e) progresso anterior inviabiliza aceitar recuo na preservação.'),

          makeLesson(12, 'Editorial — Parte 4 (Operadores)', 'Operadores de causa/efeito, autoridade, contraposição, comparação e exemplificação.', [
            { t: 'Atividades 1, 2 e 3 — Editorial sobre IA nas eleições (O Globo)', p: 'Causa/efeito, modalizador "discutível" e associação de estratégias.', a: '• Ativ. 1: a) facilidade de acesso à IA (causa) torna o eleitor presa fácil (efeito).\n• Ativ. 2: b) "discutível" expressa incerteza/ceticismo sobre a eficácia da regra.\n• Ativ. 3 (Associação): (b) Exemplificação · (c) Autoridade · (a) Contraposição.' }
          ], '• Q1 (ENEM 2023 — "Aliás"): c) acréscimo de fato comprobatório.\n• Q2 (ENEM 2021 — Lixões): c) enumeração de atividades cotidianas.'),

          makeLesson(13, 'Manifesto — Parte 1', 'Gênero de exposição pública e mobilização coletiva (1ª pessoa do plural, verbos de força).', [
            { t: 'Atividades 1 e 2 — Manifesto Jovem #ENDviolence (ONU)', p: 'Recursos persuasivos, enumeração identitária, hashtags e estrutura.', a: '• Ativ. 1: a) "urgência" cria pressão temporal e "sem atribuir o fardo" retira culpa da criança; b) enumeração dá visibilidade a grupos marginalizados; c) hashtags revelam público jovem conectado.\n• Ativ. 2 (Ordem): (b) Compromisso coletivo · (a) Princípio · (c) Reivindicação.' }
          ], '• Q1 (FUNDEP 2024): a) representar a voz coletiva dos povos indígenas.\n• Q2 (UNICAMP 2025 — "mil-lheres"): c) pluralidade identitária.'),

          makeLesson(14, 'Manifesto — Parte 2 (Adequação vocabular)', 'Escolha lexical estratégica, rejeição à neutralidade e força política das palavras.', [
            { t: 'Atividade 1 — Manifesto das crianças indígenas', p: 'Sentido de "ancestrais", "autoridade climática" e "resistência" + planejamento.', a: '• a) "Ancestrais" remete a saberes milenares, legitimando a fala das crianças.\n• b) "Autoridade climática" inverte a lógica comum, afirmando que quem vive na floresta domina o tema.\n• c) Trocar "resistência" por "teimosia/persistência" enfraquece o peso político de luta histórica.\n• Q2: Planejamento em grupo (produção pessoal).' }
          ], '• Q1 (IFF-TO — "imobilizar"): a) escolha intencional/expressiva (trocadilho com UFC).\n• Q2 (CESMAC — Diabetes): c) 1, 3 e 4 corretas ("mirabolantes" ≠ "irreversíveis").'),

          makeLesson(15, 'Críticas da mídia — Parte 1', 'Resenha crítica: resumo objetivo sem spoilers, critérios técnicos e avaliação fundamentada.', [
            { t: 'Atividade 1 — Resenha crítica de Enola Holmes', p: 'Estética visual, contraste Mycroft × Enola e argumento final.', a: '• a) Fotografia com cores claras e vibrantes retira o "peso" sombrio típico dos filmes de Sherlock Holmes.\n• b) Mycroft encarna o discurso machista (caricato/desprezível); Enola e a mãe representam força e emancipação feminina.\n• c) Mesmo não sendo inovador, recomenda pelo carisma de Millie Bobby Brown e diversão.' }
          ], '• Q1 (PUC-PR): c) Resenha (descrição resumida + valoração crítica).\n• Q2 (ENEM 2024 — Game of Thrones): b) expressões adversativas ("mas") fazem ressalvas aos elogios.'),

          makeLesson(16, 'Críticas da mídia — Parte 2 (Locução adverbial)', 'Advérbios e locuções adverbiais de modo, tempo, intensidade e afirmação na resenha.', [
            { t: 'Atividades 1 e 2 — Review de FIFA 23', p: 'Fator nostalgia, jogabilidade cadenciada e valor das locuções adverbiais.', a: '• Ativ. 1: 1) A nostalgia (último título EA/FIFA) o mantém entre os melhores; 2) "mais cadenciado" = menos correria, foco em toque de bola e estratégia.\n• Ativ. 2: 1) "com chave de ouro" = locução adverbial de modo (avaliação excelente); 2) "sem dúvida alguma" = afirmação/certeza absoluta dando segurança ao comprador.' }
          ], '• Q1 (FGV 2024): c) sem dúvida = indubitavelmente.\n• Q2 (FGV 2022): d) pouco a pouco = paulatinamente.'),

          makeLesson(17, 'Divulgação científica — Parte 1', 'Democratização da ciência: linguagem acessível, metáforas cotidianas e fontes de autoridade.', [
            { t: 'Atividade 1 — "Afinal, o tempo existe?" (Revista Galileu)', p: 'Função das metáforas, exemplo do GPS e papel da entropia.', a: '• a) "Mingau grosso" e "sorvete derretendo" traduzem percepção abstrata do tempo em imagens sensoriais didáticas.\n• b) O GPS prova que a relatividade de Einstein impacta o cotidiano prático.\n• c) A entropia (tendência estatística à maior desordem) determina a seta/irreversibilidade do tempo.' }
          ], '• Q1 (ENEM 2016): d) trata de descobertas da ciência com linguagem acessível ao público geral.\n• Q2 (ENEM 2018 — "Mais big do que bang"): c) expansão substitui ideia de explosão.'),

          makeLesson(18, 'Divulgação científica — Parte 2 (Coerência)', 'Princípios da coerência textual: não contradição, não tautologia e relevância.', [
            { t: 'Atividades 1 e 2 — Ciúmes entre babuínos (Superinteressante)', p: 'Coerência temática (ponte inicial) e princípio da não contradição.', a: '• Ativ. 1: Começar falando de ciúmes entre irmãos humanos cria analogia que engaja o leitor sem ferir a relevância, pois o texto compara as duas espécies.\n• Ativ. 2: Admitir dúvidas no final não contradiz o título, pois há modalizadores de hipótese ("sugerem", "parece ser"), coerentes com o método científico.' }
          ], '• Q1 (ENEM 2019 — Slow food): b) "agora" sinaliza mudança de foco temático.\n• Q2 (UNIFACIG): c) coesão anafórica ("essa questão") entre 2º e 3º parágrafos.'),

          makeLesson(19, 'Conto fantástico', 'Verossimilhança inicial, ruptura pelo insólito, hesitação e simbolismo.', [
            { t: 'Atividades 1 e 2 — "O coração do menino e o menino do coração" (Mia Couto)', p: 'Subversão da previsão da avó, ligação cartas/coração e função do desfecho.', a: '• Ativ. 1: a) Pés "divergentes" subvertem o isolamento ("caminhar para dentro"), indicando abertura para o mundo; b) a leitura dos versos por Marlisa provoca o parto mágico do coração (arte humaniza o que a ciência rotulava).\n• Ativ. 2: b) subversão da realidade em que a sensibilidade poética ganha vida, superando os rótulos de "tonto/anormal".' }
          ], '• Q1 (UECE — Murilo Rubião): d) "Não parasse ele..." trata da logística da ação, não do cenário fantástico.\n• Q2: a) apenas I correta (narrador-personagem em 1ª pessoa).'),

          makeLesson(20, 'Microconto — Parte 1', 'Concisão radical, estética da sugestão (elipses), leitor coautor e virada (punchline).', [
            { t: 'Atividades 1 e 2 — Dalton Trevisan e Leonardo Sakamoto', p: 'Inferência de elipses e leitura de metáfora/elemento fantástico.', a: '• Ativ. 1 (Trevisan): a) o espanto ("você conhece meu pai!") revela ruptura total após o divórcio; b) a brevidade potencializa o choque imediato do desfecho.\n• Ativ. 2 (Sakamoto): a) "coração desabou" = metáfora para a morte súbita do avô; b) o arco-íris criado pelo céu acolhe a dor do neto e homenageia o avô.' }
          ], '• Q1 (UFT 2018): c) estilo marcante com linguagem concisa e elipses.\n• Q2 (IDHTEC 2024): d) reminiscências da infância de um homem e seu pai.'),

          makeLesson(21, 'Microconto — Parte 2 (Pontuação)', 'Pontuação como recurso expressivo de ritmo, pausa dramática e emoção.', [
            { t: 'Atividades 1 e 2 — Efeitos do ponto final, vírgulas e exclamações', p: 'Análise de "Choraram. Riram.", isolamento por vírgulas e falas de Frederico.', a: '• Ativ. 1: a) Pontos finais em "Choraram. Riram." isolam o peso emocional de cada momento (tristeza × superação); b) as vírgulas em ", em desespero," criam pausa dramática que simula choque/hesitação.\n• Ativ. 2: c) as exclamações revelam entusiasmo genuíno e desejo de contagiar o amigo.' }
          ], '• Q1 (ENEM 2016): d) dois-pontos introduzem argumento esclarecedor.\n• Q2 (IADES 2025 — Armandinho): d) vírgulas separam elementos de uma enumeração.'),

          makeLesson(22, 'Vídeo-minuto — Parte 1', 'Gênero audiovisual de 60 segundos: síntese, linguagem multissemiótica e recorte preciso.', [
            { t: 'Atividade 1 — Escolha do recorte preciso em 60s', p: 'Qual recorte funciona para um vídeo-minuto sobre gêneros literários?', a: '• Resposta: b) Explicar a diferença entre épico, lírico e dramático usando apenas um exemplo visual para cada gênero (recorte objetivo e dinâmico).' }
          ], null),

          makeLesson(23, 'Vídeo-minuto — Parte 2', 'Roteiro em 3 atos: Gancho (0–10s), Desenvolvimento (10–50s) e Encerramento (50–60s).', [
            { t: 'Atividade 1 — Estrutura do roteiro multissemiótico', p: 'Como organizar o roteiro de revisão do bimestre em 60 segundos?', a: '• 0–10s (Gancho): pergunta/imagem forte apresentando o tema.\n• 10–50s (Desenvolvimento): 3 conteúdos do bimestre (ex.: Barroco, Editorial, Microconto) com palavras-chave na tela e exemplos rápidos.\n• 50–60s (Encerramento): síntese final clara + trilha coerente ao clima do vídeo.' }
          ], null),

          makeLesson(24, 'Vídeo-minuto — Parte 3', 'Avaliação audiovisual crítica e escuta ativa das produções da turma.', [
            { t: 'Síntese de Avaliação — 3 Critérios Fundamentais', p: 'Quais critérios orientam a análise e o feedback dos vídeos-minuto?', a: '• 1. Capacidade de síntese: recorte preciso e fio condutor claro em 60s.\n• 2. Multissemiose e criatividade: harmonia entre visual (cores, fontes, cortes) e sonoro (trilha, entonação).\n• 3. Correção e relevância: precisão dos conceitos de Língua Portuguesa com exemplos práticos e feedback construtivo.' }
          ], null),
        ],
      },

      {

          makeLesson(1, 'Gráfico da função do 2º grau', 'Parábola f(x)=ax²+bx+c: concavidade (a), corte em y (c), raízes e eixo de simetria.', [
            { t: 'Atividades 1 e 2 — Túnel parabólico e Lei de formação', p: 'y = 6x − x² (largura e altura máxima) e lei pelo gráfico.', a: '• Ativ. 1: raízes x=0 e x=6 → largura = 6 m; vértice x_v=3 → altura máx y_v = 6(3)−3² = 9 m.\n• Ativ. 2: c = 4, raízes 2 e 4 → a = 1/2, b = −3 → f(x) = x²/2 − 3x + 4 → alternativa (c).' }

            { t: 'Atividades 1, 2 e 3 — Vértice, Imagem e Castelo', p: 'Julgamento V/F, conjunto-imagem de y=3x²−6x−7 e altura de y=10−x².', a: '• Ativ. 1: V, V, F, F, V.\n• Ativ. 2: y_v = −120/12 = −10 (a>0) → Im = {y ∈ ℝ | y ≥ −10} → alternativa (e).\n• Ativ. 3: b=0 → x_v=0, y_v = 10 m → alternativa (c).' }
          ], '• Caderno Q1–Q5: foco em cálculo de V(x_v, y_v), conjunto-imagem e área parabólica (ENEM 2016: 36 m²).'),

          makeLesson(3, 'Coordenadas do vértice — Parte 2', 'Aplicações de vértice em pontes, gráficos, beisebol (UERJ) e voleibol (UNICAMP 2026).', [
            { t: 'Atividades 1 a 5 — Exercícios de Vértice', p: 'Arco de ponte, lei com V(5,−5), mínimo de x²−12x+20, UERJ e UNICAMP 2026.', a: '• Ativ. 1: x_v = 4, y_v = 3,6 → (4; 3,6) (a).\n• Ativ. 2: f(x) = x²/5 − 2x (c).\n• Ativ. 3: mínimo igual a −16 para x = 6 (b).\n• Ativ. 4 (UERJ): x_v1 = 15 → x_A = 30; x_v2 = 35 → x_B = 40 m (b).\n• Ativ. 5 (UNICAMP 2026): c=2, V(9,3) → y = −x²/81 + 2x/9 + 2 (c).' }
          ], '• Caderno Q6: a) Mínimo (a > 0) · b) Im = {y ∈ ℝ | y ≥ −9}.'),

          makeLesson(4, 'Revisão: gráfico do 2º grau', 'Síntese de concavidade, média das raízes e coordenadas do vértice.', [
            { t: 'Atividades 1 a 4 — Revisão de Parábolas', p: 'Gincana de cartões, y=6x−x², abscissa pelo gráfico e foguete y=20x−5x².', a: '• Ativ. 1: Cartão III (y = 3x² − 1, a=3>0) (c).\n• Ativ. 2: máximo em (3, 9) (b).\n• Ativ. 3: raízes −3 e 1 → x_v = (−3+1)/2 = −1 (b).\n• Ativ. 4: x_v = 2, y_v = 20 → (2, 20) (a).' }
          ], null),

          makeLesson(5, 'Máximo ou mínimo do 2º grau — Parte 1', 'Otimização (custo mínimo, altura máxima) e intervalos de crescimento/decrescimento.', [
            { t: 'Atividades 1, 2 e 3 — Custo mínimo, Bola e Comportamento', p: 'C(x)=x²−50x+750, h(t)=1+12t−3t² e y=−x²+4x−3.', a: '• Ativ. 1: a) x_v = 25 unidades · b) custo mínimo = R$ 125,00.\n• Ativ. 2: y_v = −(144+12)/(−12) = 13 m (b).\n• Ativ. 3: a<0 e x_v=2 → crescente para x < 2 (c).' }
          ], '• Caderno Q12–Q17: aplicações diretas de x_v = −b/(2a) e y_v = −Δ/(4a) (ex.: SARESP chute = 25 m).'),

          makeLesson(6, 'Máximo ou mínimo do 2º grau — Parte 2', 'Modelagem de área máxima com perímetro fixo e lucro máximo (L = R − C).', [

    /* =====================================================================
       4. ESTADO DA APLICAÇÃO & PERSISTÊNCIA (LOCALSTORAGE)
       ===================================================================== */
    const STORAGE_KEY = 'nexo_completed_v1';
    const state = {
      screen: 'hub',          // 'hub' | 'timeline' | 'activity'
      bookFilter: 'all',      // 'all' | 1 | 2 | 3
      hubIndex: 2,
      subjectId: null,
      lessonIndex: 0,
      activityIndex: 0,
      completed: loadCompleted(),
      nexoMode: 'concept',    // 'concept' | 'steps' | 'tip' | 'chat'
      chatHistory: [],
    };

    function loadCompleted() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveCompleted() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.completed));
      } catch (e) {
        // Silencioso caso storage esteja bloqueado
      }
    }

    function getActKey(subjectId, lessonNum, actId) {
      return `${subjectId}::${lessonNum}::${actId}`;
    }

    function isActivityDone(subjectId, lessonNum, actId) {
      return Boolean(state.completed[getActKey(subjectId, lessonNum, actId)]);
    }

    function isLessonDone(subjectId, lesson) {
      return lesson.activities.length > 0 && lesson.activities.every((a) => isActivityDone(subjectId, lesson.num, a.id));
    }

    function getSubjectProgress(subject) {
      const total = subject.lessons.length;
      const done = subject.lessons.filter((l) => isLessonDone(subject.id, l)).length;
      return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function updateGlobalProgress() {
      let total = 0;
      let done = 0;
      SUBJECTS.forEach((s) => {
        const p = getSubjectProgress(s);
        total += p.total;
        done += p.done;
      });
      const txt = document.getElementById('global-progress-text');
      const bar = document.getElementById('global-progress-bar');
      if (txt) txt.textContent = `${done} / ${total} aulas`;
      if (bar) bar.style.width = `${total ? Math.round((done / total) * 100) : 0}%`;
    }

    /* =====================================================================
       5. UTILITÁRIOS (TOAST, COPY COMPATÍVEL COM IFRAME, ESCAPE HTML)
       ===================================================================== */
    let toastTimer = null;
    function showToast(message) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = message;
      el.classList.remove('opacity-0', 'translate-y-2');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', 'translate-y-2');
      }, 2200);
    }

    function copyTextSafe(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Resposta copiada!');
      } catch (e) {
        showToast('Não foi possível copiar.');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatMultiline(str) {
      return escapeHtml(str).replace(/\n/g, '<br>');
    }

    function getFilteredSubjects() {
      if (state.bookFilter === 'all') return SUBJECTS;
      return SUBJECTS.filter((s) => s.book === state.bookFilter);
    }

    /* =====================================================================
       6. RENDERIZAÇÃO PRINCIPAL
       ===================================================================== */
    const mainEl = document.getElementById('app-main');

    function render() {
      document.body.dataset.view = state.screen;
      updateGlobalProgress();
      if (state.screen === 'hub') renderHub();
      else if (state.screen === 'timeline') renderTimeline();
      else if (state.screen === 'activity') renderActivity();
    }

    /* ---------------------------------------------------------------------
       TELA 1 — HUB ESPACIAL DE MATÉRIAS
       --------------------------------------------------------------------- */
    function renderHub() {
      document.body.dataset.view = 'hub';
      // Ordem visual idêntica à referência, sem alterar nenhum objeto de matéria/aula.
      const order = ['historia', 'fisica', 'matematica', 'quimica', 'biologia', 'geografia', 'portugues', 'ingles'];
      const list = order.map(id => SUBJECTS.find(s => s.id === id)).filter(Boolean);
      state.bookFilter = 'all';
      if (state.hubIndex >= list.length) state.hubIndex = 2;
      mainEl.innerHTML = `
        <section class="reference-home screen-enter" aria-label="Selecionar uma matéria">
          <div class="ref-wave" aria-hidden="true"><svg viewBox="0 0 50 35" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 14v8M8 7v21M14 11v13M20 2v31M26 8v19M32 4v27M38 12v11M44 7v20M50 14v8"/></svg></div>
          <div class="ref-stage">
            <div id="hub-carousel" class="ref-cards no-scrollbar" role="group" aria-label="8 disciplinas; deslize para ver mais">
              ${list.map((s, idx) => {
                const prog=getSubjectProgress(s);
                return `<button type="button" data-subject-id="${s.id}" data-idx="${idx}" class="ref-card subject-card ${idx===state.hubIndex?'subject-card-active':''}" aria-label="Abrir ${s.name}, ${s.lessons.length} aulas" aria-pressed="${idx===state.hubIndex}">
                  <span class="ref-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                  <span class="ref-card-small-icon" aria-hidden="true">${REFERENCE_ICONS[s.id]}</span>
                  <span class="ref-card-big-icon" aria-hidden="true">${REFERENCE_ICONS[s.id]}</span>
                  <span class="ref-card-content"><strong>${s.name}</strong><small>${prog.done ? `${prog.done} de ${prog.total} aulas` : `${s.lessons.length} aulas`}</small></span>
                </button>`;
              }).join('')}
            </div>
            <div class="ref-track" aria-hidden="true"><div class="ref-track-fill" id="ref-track-fill"></div></div>
          </div>
          <div class="ref-dots ref-dots-left" aria-hidden="true">${'<i></i>'.repeat(9)}</div>
          <div class="ref-dots ref-dots-right" aria-hidden="true">${'<i></i>'.repeat(9)}</div>
          <span class="ref-screen-reader-hint">Use as setas para alternar entre matérias ou selecione um cartão para abrir as aulas.</span>
        </section>`;
      const carousel=document.getElementById('hub-carousel');
      const cards=[...carousel.querySelectorAll('.ref-card')];
      const prev=document.getElementById('ref-header-prev');
      const next=document.getElementById('ref-header-next');
      if(prev) prev.disabled=false;
      if(next) next.disabled=false;
      cards.forEach(card=>{
        card.addEventListener('click',()=>{
          if(carousel.dataset.dragged==='true') return;
          openSubject(card.dataset.subjectId);
        });
        card.addEventListener('mouseenter',()=>{ if(window.matchMedia('(hover:hover)').matches){ state.hubIndex=Number(card.dataset.idx); highlightHubCard(); }});
        card.addEventListener('focus',()=>{state.hubIndex=Number(card.dataset.idx);highlightHubCard()});
      });
      let pointerStartX=null,pointerScroll=0;
      carousel.addEventListener('pointerdown',e=>{pointerStartX=e.clientX;pointerScroll=carousel.scrollLeft;carousel.dataset.dragged='false'});
      carousel.addEventListener('pointermove',e=>{if(pointerStartX!==null && e.pointerType==='mouse' && e.buttons){ const d=e.clientX-pointerStartX;if(Math.abs(d)>7){carousel.dataset.dragged='true';carousel.scrollLeft=pointerScroll-d;}}});
      carousel.addEventListener('pointerup',()=>{pointerStartX=null;setTimeout(()=>carousel.dataset.dragged='false',60)});
      carousel.addEventListener('pointercancel',()=>pointerStartX=null);
      const refresh=()=>{
        const fill=document.getElementById('ref-track-fill');
        if(fill){const max=Math.max(1,carousel.scrollWidth-carousel.clientWidth);const sc=carousel.scrollLeft/max;fill.style.width=`${Math.min(100,80+sc*20)}%`;}
      };
      carousel.addEventListener('scroll',refresh,{passive:true});refresh();
      if(window.matchMedia('(max-width: 700px)').matches){
        requestAnimationFrame(()=>{const current=cards[state.hubIndex];if(current)carousel.scrollLeft=current.offsetLeft-(carousel.clientWidth-current.clientWidth)/2;refresh();});
      }
    }

    function highlightHubCard() {
      const cards=mainEl.querySelectorAll('.subject-card');
      cards.forEach((card,idx)=>{
        card.classList.toggle('subject-card-active',idx===state.hubIndex);
        card.setAttribute('aria-pressed',String(idx===state.hubIndex));
      });
    }

    function moveHubCarousel(dir) {
      const list=mainEl.querySelectorAll('.subject-card');
      if(!list.length)return;
      state.hubIndex=(state.hubIndex+dir+list.length)%list.length;
      highlightHubCard();
      const target=list[state.hubIndex];
      if(target)target.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'nearest',inline:'center'});
    }

    function openSubject(subjectId, lessonIdx = 0) {
      state.subjectId = subjectId;
      state.lessonIndex = lessonIdx;
      state.screen = 'timeline';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function getFlatActivityList(subject) {

        l.activities.forEach((a, aIdx) => {
          flat.push({ lessonIdx: lIdx, actIdx: aIdx, lesson: l, act: a });
        });
      });
      return flat;
    }

              <!-- Card Destacado da Resposta Resumida -->

                <div class="flex items-center justify-between mb-3">

                    <h2 class="text-sm font-semibold text-white tracking-wide">NEXO Assistente</h2>

      // Navegação Breadcrumb e Anterior/Próxima

      if (nextItem) {
        document.getElementById('btn-next-act').addEventListener('click', () =>

      // Copiar resposta
      document.getElementById('btn-copy-answer').addEventListener('click', () => {
        copyTextSafe(`${subject.name} — Aula ${String(lesson.num).padStart(2, '0')} (${act.title})\n\n${act.answer}`);
      });

      // Marcar concluída
      document.getElementById('btn-toggle-done').addEventListener('click', () => {
        const key = getActKey(subject.id, lesson.num, act.id);
        if (state.completed[key]) {
          delete state.completed[key];
          showToast('Atividade desmarcada.');
        } else {
          state.completed[key] = true;
          showToast('Atividade marcada como concluída!');
        }
        saveCompleted();
        renderActivity();
      });

      // Botões do Agente NEXO
      const pills = mainEl.querySelectorAll('.nexo-pill');
      function updateNexoPills() {
        pills.forEach((p) => {
          const active = p.dataset.nexoMode === state.nexoMode;
          p.className = `nexo-pill px-3 py-1.5 rounded-full text-xs font-medium border transition-all ${
            active
              ? 'bg-white text-[#050507] border-white'
              : 'bg-white/[0.03] text-[#9b9ba5] border-white/12 hover:border-white/30 hover:text-white'
          }`;
        });
      }

      function showNexoPreset(mode) {
        state.nexoMode = mode;
        updateNexoPills();
        const titleMap = {
          concept: 'Conceito-chave',
          steps: 'Passo a passo',
          tip: 'Dica de prova',
        };
        const contentMap = {
          concept: act.concept,
          steps: act.steps,
          tip: act.tip,
        };
        typeIntoNexo(titleMap[mode], contentMap[mode]);
      }

      pills.forEach((p) => {
        p.addEventListener('click', () => showNexoPreset(p.dataset.nexoMode));
      });

      // Chat local inteligente do NEXO
      const chatForm = document.getElementById('nexo-chat-form');
      const chatInput = document.getElementById('nexo-chat-input');
      chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const q = chatInput.value.trim();
        if (!q) return;
        chatInput.value = '';
        state.nexoMode = 'chat';
        updateNexoPills();
        handleLocalNexoQuery(q, subject, lesson, act);
      });

      // Exibe conceito inicial
      showNexoPreset('concept');
    }

    let typingInterval = null;
    function typeIntoNexo(heading, text, extraHtml = '') {
      const out = document.getElementById('nexo-output');
      if (!out) return;
      clearInterval(typingInterval);
      out.innerHTML = `
        <div class="text-[11px] uppercase tracking-[0.14em] text-[#8a8a93]">${escapeHtml(heading)}</div>
        <div id="nexo-typed" class="typing-caret whitespace-pre-line text-[#e5e5ec]"></div>
        <div id="nexo-extra"></div>
      `;
      const target = document.getElementById('nexo-typed');
      const extra = document.getElementById('nexo-extra');
      let i = 0;
      const step = Math.max(2, Math.ceil(text.length / 45));
      typingInterval = setInterval(() => {
        i += step;
        if (i >= text.length) {
          target.textContent = text;
          target.classList.remove('typing-caret');
          if (extraHtml) extra.innerHTML = extraHtml;
          clearInterval(typingInterval);
        } else {
          target.textContent = text.slice(0, i);
        }
      }, 14);
    }

    function handleLocalNexoQuery(query, subject, lesson, act) {
      const q = query.toLowerCase();
      // 1. Intenções diretas sobre a aula ativa
      if (q.includes('passo') || q.includes('como faz') || q.includes('calcul') || q.includes('cálcul') || q.includes('resolv')) {
        return typeIntoNexo(`NEXO · Passo a passo (${lesson.title})`, act.steps);
      }
      if (q.includes('dica') || q.includes('prova') || q.includes('vestibular') || q.includes('enem') || q.includes('pegadinha')) {
        return typeIntoNexo(`NEXO · Dica de prova (${lesson.title})`, act.tip);
      }
      if (q.includes('resum') || q.includes('conceit') || q.includes('explic') || q.includes('o que é') || q.includes('sobre')) {
        return typeIntoNexo(`NEXO · Explicação (${lesson.title})`, `${act.concept}\n\nResumo da aula: ${lesson.summary}`);
      }

      // 2. Busca por palavras-chave em toda a base das 114 aulas
      const terms = q.split(/\s+/).filter((t) => t.length > 2);
      const matches = [];
      SUBJECTS.forEach((s) => {
        s.lessons.forEach((l, lIdx) => {
          const hay = `${s.name} ${l.title} ${l.summary} ${l.activities.map((a) => `${a.title} ${a.answer}`).join(' ')}`.toLowerCase();
          let score = 0;
          terms.forEach((t) => { if (hay.includes(t)) score++; });
          if (score > 0) matches.push({ score, subject: s, lesson: l, lIdx });
        });
      });

      matches.sort((a, b) => b.score - a.score);
      const top = matches.slice(0, 3);

      if (top.length > 0) {
        const best = top[0];
        const msg = `Encontrei referência direta em ${best.subject.name} — Aula ${String(best.lesson.num).padStart(2, '0')} (${best.lesson.title}):\n\n${best.lesson.activities[0].answer}`;
        const linksHtml = `
          <div class="pt-3 mt-2 border-t border-white/10 space-y-1.5">
            <div class="text-[11px] text-[#8a8a93]">Ir direto para a aula:</div>
            ${top.map((m) => `
              <button
                data-jump-sub="${m.subject.id}"
                data-jump-les="${m.lIdx}"
                class="nexo-jump w-full text-left px-3 py-2 rounded-lg border border-white/10 bg-white/[0.03] hover:bg-white/[0.08] text-xs text-white transition-colors"
              >
                ${m.subject.name} · Aula ${String(m.lesson.num).padStart(2, '0')} — ${escapeHtml(m.lesson.title)} →
              </button>
            `).join('')}
          </div>
        `;
        typeIntoNexo(`NEXO · Busca para "${query}"`, msg, linksHtml);
        setTimeout(() => {
          document.querySelectorAll('.nexo-jump').forEach((btn) => {
            btn.addEventListener('click', () => {
              openActivity(btn.dataset.jumpSub, Number(btn.dataset.jumpLes), 0);
            });
          });
        }, 700);
      } else {
        typeIntoNexo(
          'NEXO · Contexto da Aula',
          `Não encontrei um termo exato para "${query}", mas nesta aula (${lesson.title}) o ponto central é:\n\n${act.concept}\n\nTente usar palavras-chave como "Kepler", "Barroco", "pH", "Mendel", "vértice" ou clique nos botões acima.`
        );
      }
    }

    /* =====================================================================
       7. BUSCA GLOBAL INSTANTÂNEA (MODAL CTRL + K)
       ===================================================================== */
    const searchModal = document.getElementById('search-modal');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    function openSearchModal() {
      searchModal.classList.remove('hidden');
      searchModal.classList.add('flex');
      searchInput.value = '';
      renderSearchResults('');
      setTimeout(() => searchInput.focus(), 20);
    }

    function closeSearchModal() {
      searchModal.classList.add('hidden');
      searchModal.classList.remove('flex');
    }

    function renderSearchResults(query) {
      const q = query.trim().toLowerCase();
      const results = [];

      SUBJECTS.forEach((s) => {
        s.lessons.forEach((l, lIdx) => {
          l.activities.forEach((a, aIdx) => {
            const hay = `${s.name} aula ${l.num} ${l.title} ${l.summary} ${a.title} ${a.answer}`.toLowerCase();
            if (!q || hay.includes(q)) {
              results.push({ subject: s, lesson: l, lIdx, act: a, aIdx });
            }
          });
        });
      });

      const shown = results.slice(0, 24);
      if (!shown.length) {
        searchResults.innerHTML = `<div class="p-6 text-center text-xs text-[#8a8a93]">Nenhum resultado encontrado para "${escapeHtml(query)}".</div>`;
        return;
      }

      searchResults.innerHTML = shown.map((r) => `
        <button
          data-s="${r.subject.id}"
          data-l="${r.lIdx}"
          data-a="${r.aIdx}"
          class="search-item w-full text-left px-3.5 py-2.5 rounded-xl hover:bg-white/[0.06] transition-colors flex items-start justify-between gap-3"
        >
          <div class="min-w-0">
            <div class="flex items-center gap-2 text-[11px] text-[#8a8a93] mb-0.5">
              <span class="text-white/90 font-medium">${r.subject.name}</span>
              <span>·</span>
              <span>Aula ${String(r.lesson.num).padStart(2, '0')}</span>
              <span>·</span>
              <span>${r.act.type}</span>
            </div>
            <div class="text-sm text-white font-medium truncate">${escapeHtml(r.lesson.title)} — ${escapeHtml(r.act.title)}</div>
            <div class="text-xs text-[#8a8a93] truncate mt-0.5">${escapeHtml(r.act.answer.replace(/\n/g, ' '))}</div>
          </div>
          <span class="text-xs text-[#6f6f78] shrink-0 mt-1">↵</span>
        </button>
      `).join('');

      searchResults.querySelectorAll('.search-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          closeSearchModal();
          openActivity(btn.dataset.s, Number(btn.dataset.l), Number(btn.dataset.a));
        });
      });
    }

    document.getElementById('ref-header-prev').addEventListener('click',()=>{ if(state.screen==='hub')moveHubCarousel(-1);else if(state.screen==='timeline')openHub();else{const b=document.getElementById('btn-prev-act');if(b && !b.disabled)b.click();} });
    document.getElementById('ref-header-next').addEventListener('click',()=>{ if(state.screen==='hub')moveHubCarousel(1);else if(state.screen==='timeline')openHub();else{const b=document.getElementById('btn-next-act');if(b && !b.disabled)b.click();} });
    document.getElementById('btn-open-search').addEventListener('click', openSearchModal);
    document.getElementById('btn-close-search').addEventListener('click', closeSearchModal);
    document.getElementById('btn-logo-home').addEventListener('click', openHub);
    searchModal.addEventListener('click', (e) => { if (e.target === searchModal) closeSearchModal(); });
    searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));

    /* =====================================================================
       8. ATALHOS DE TECLADO GLOBAIS
       ===================================================================== */
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (searchModal.classList.contains('hidden')) openSearchModal();
        else closeSearchModal();
        return;
      }
      if (e.key === 'Escape' && !searchModal.classList.contains('hidden')) {
        closeSearchModal();
        return;
      }
      if (!searchModal.classList.contains('hidden')) return;
      if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (state.screen === 'hub') {
        if (e.key === 'ArrowRight') moveHubCarousel(1);
        else if (e.key === 'ArrowLeft') moveHubCarousel(-1);
        else if (e.key === 'Enter') {
          const selected = mainEl.querySelector(`.ref-card[data-idx="${state.hubIndex}"]`);
          if (selected) openSubject(selected.dataset.subjectId);
        }
      }
    });

    // Inicialização
    render();
  </script>
</body>
</html>
